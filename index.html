<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Números</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <h2>Comparação dos Números</h2>
        <form id="form-comparacao">
            <input type="number" placeholder="Número A" id="numA">
            <input type="number" placeholder="Número B" id="numB">
            <button id="btn-comparar" type="submit">Comparar</button>
        </form>
        <p class="resultado"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
